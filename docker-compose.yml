services:
  app-dev:
    image: node:20-alpine
    profiles:
      - dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

  app-prod:
    build:
      context: .
      target: production
    profiles:
      - prod
    ports:
      - "3000:80"
    restart: unless-stopped
